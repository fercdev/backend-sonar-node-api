name: CI/CD backend pipeline (v1)

on:
  push:
    branches:
      - master

env:
  NODE_VERSION: 24
  DOCKER_IMAGE_REPOSITORY_NAME: fercdevv/backend-sonar-node-api
  DOCKER_IMAGE_TAG: latest
  REMOTE_IMAGE_REF: fercdevv/backend-sonar-node-api:${{ github.sha }}
  TRIVY_CACHE_DIR: /tmp/trivy-cache

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de codigo
        uses: actions/checkout@v7
      
      - name: Setup Nodejs Version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION}}
      
      - name: Install dependencies
        run: npm ci

      - name: Ejecutar unit tests
        run: npm test
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout de codigo
        uses: actions/checkout@v7
      
      - name: Conectar con DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Build docker image and push sha tag
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_REPOSITORY_NAME }}:${{ github.sha }}

  # trivy-scan:
